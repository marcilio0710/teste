    <main>
        <div class="container">
        <form action="agendar.php" method="POST">   

            <h1>Agende sua visita</h1>


            <div class="input-box">                
                <input placeholder="Nome" type="text" name="nome" required>                  
            </div>

            <div class="input-box">
                <input placeholder="E-mail" type="email" name="email" required>
                <i class="fa-regular fa-user"></i>              
            </div>

            <div class="input-box">                
                <input type="text" name="tel" id="tel" maxlength="15" placeholder="telefone" required>                 
            </div>

            <div class="input-box">
                <input type="text" name="data_nascimento" placeholder="dd/mm/aaaa" pattern="\d{2}/\d{2}/\d{4}" required>                             
            </div>

            <div class="input-box">
                <input placeholder="Horário" type="time" name="horario" required>                             
            </div>

            <div class="input-obs">
                <textarea name="observacoes" placeholder="Observações" required></textarea>                          
            </div>


            <button type="submit" class="cadastro-page">Agendar</button>  

        </form>
        </div>

    </main>
    <script>
    document.getElementById('tel').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '').slice(0, 11);
    
    if (v.length >= 7) {
        v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
    } else if (v.length >= 3) {
        v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
    } else if (v.length > 0) {
        v = v.replace(/(\d{0,2})/, '($1');
    }

    e.target.value = v;
});
</script>
